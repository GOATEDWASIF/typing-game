<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Contest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Game Screen -->
    <div id="game-container">
        <h1>Tatsumi JHS Typing on english ᵇʸ ᵂᵃˢᶦᶠ</h1>
        
        <button id="start-btn">Press START</button>

        <div class="stats">
            <div>Score: <span id="score">0</span></div>
            <div>Time Left: <span id="time">60</span></div>
        </div>

        <!-- The area where words appear goes here -->
        <div id="word-display"></div>
        <input type="text" id="word-input" autocomplete="off" placeholder="Type here..." autofocus>
        
        <button id="action-btn">START</button>
    </div>

    <!-- End Game Win/Lose Menu Overlay (Initially hidden via CSS) -->
    <div id="game-over">
        <h1>Game Over</h1>
        <p>Better luck next time!</p>
        <button id="restart-btn">Play Again</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
