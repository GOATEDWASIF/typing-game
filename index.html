<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Contest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game">
    <h1>Tatsumi JHS Typing on english ᵇʸ ᵂᵃˢᶦᶠ</h1>

    <div id="word-box">
      <div id="kanji">Press START</div>
      <div id="kana" style="display: none;"></div>
      <div id="romaji-guide"></div>
    </div>

    <input
      type="text"
      id="input"
      placeholder="Press START to begin typing"
      autocomplete="off"
      disabled
    >

    <div id="status">
      <div id="score">Score: 0</div>
      <div id="time">Time Left: 60</div>
    </div>

    <button id="start">START</button>

    <div id="game-over"></div>
  </div>

  <audio id="se-correct" src="sounds/correct.mp3" preload="auto"></audio>
  <audio id="se-miss" src="sounds/miss.mp3" preload="auto"></audio>
  <audio id="se-start" src="sounds/start.mp3" preload="auto"></audio>
  <audio id="se-end" src="sounds/end.mp3" preload="auto"></audio>

  <script src="script.js"></script>
  <!-- End Game Win/Lose Menu Overlay -->
<div id="endGameMenu" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: none; justify-content: center; align-items: center; z-index: 10; font-family: sans-serif;">
    <div style="background: #1e293b; border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px; text-align: center; width: 300px; color: white; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
        <h1 id="menuTitle" style="margin-bottom: 10px; font-size: 2.5rem;">Game Over</h1>
        <p id="menuMessage" style="color: #94a3b8; margin-bottom: 25px;">Better luck next time!</p>
        <button onclick="location.reload()" style="background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; padding: 12px 25px; font-size: 1rem; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%;">Play Again</button>
    </div>
</div>
</body>
</html>
